<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 402" width="100%" height="100%">
  <defs>
    <!-- Warm Champagne Amber Glow Background -->
    <linearGradient id="amberChampagneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="50%" stop-color="#F5ECE0" />
      <stop offset="100%" stop-color="#EADDCB" />
    </linearGradient>

    <!-- 3D Metallic Gold Gradient for Badge & Live Now -->
    <linearGradient id="goldMetallic3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC678" />
      <stop offset="25%" stop-color="#FCEECB" />
      <stop offset="50%" stop-color="#D4A346" />
      <stop offset="75%" stop-color="#F8E5B6" />
      <stop offset="100%" stop-color="#B88628" />
    </linearGradient>

    <linearGradient id="goldTextGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#E5BC64" />
      <stop offset="70%" stop-color="#B38022" />
      <stop offset="100%" stop-color="#845A0E" />
    </linearGradient>

    <!-- Jewel Core Gradient -->
    <linearGradient id="jewelCenter3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E1535" />
      <stop offset="50%" stop-color="#4A0B22" />
      <stop offset="100%" stop-color="#2D0514" />
    </linearGradient>

    <filter id="goldDropShadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5B3A0D" flood-opacity="0.4" />
    </filter>

    <filter id="badgeShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <linearGradient id="modelMask3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="20%" stop-color="#000000" stop-opacity="1" />
      <stop offset="80%" stop-color="#000000" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <mask id="modelBlend3">
      <rect x="0" y="0" width="1024" height="402" fill="url(#modelMask3)" />
    </mask>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1024" height="402" fill="url(#amberChampagneBg)" />

  <!-- Bokeh Circles & Sparkles -->
  <circle cx="260" cy="70" r="40" fill="#FFFFFF" fill-opacity="0.5" filter="blur(8px)" />
  <circle cx="500" cy="45" r="55" fill="#FFFFFF" fill-opacity="0.55" filter="blur(10px)" />
  <circle cx="740" cy="85" r="45" fill="#FFFFFF" fill-opacity="0.4" filter="blur(9px)" />
  <circle cx="360" cy="115" r="26" fill="#FFF4DC" fill-opacity="0.65" filter="blur(5px)" />

  <g fill="#ECC678" opacity="0.85">
    <path d="M 230 55 Q 230 65 220 65 Q 230 65 230 75 Q 230 65 240 65 Q 230 65 230 55 Z" />
    <path d="M 540 35 Q 540 45 530 45 Q 540 45 540 55 Q 540 45 550 45 Q 540 45 540 35 Z" />
    <path d="M 760 70 Q 760 80 750 80 Q 760 80 760 90 Q 760 80 770 80 Q 760 80 760 70 Z" />
  </g>

  <!-- 2. Center Editorial Beauty Models & Perfumery -->
  <g mask="url(#modelBlend3)">
    <image 
      href="https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&amp;fit=crop&amp;w=900&amp;q=90" 
      x="280" 
      y="-15" 
      width="460" 
      height="370" 
      preserveAspectRatio="xMidYMid slice" 
    />
  </g>

  <!-- 3. Left Octagonal Badge with Double Gold Rim -->
  <g transform="translate(68, 38)" filter="url(#badgeShadow3)">
    <!-- Outer Gold Octagon -->
    <polygon points="46,0 124,0 170,46 170,124 124,170 46,170 0,124 0,46" fill="url(#goldMetallic3)" />
    <!-- Inner Dark Groove -->
    <polygon points="48,4 122,4 166,48 166,122 122,166 48,166 4,122 4,48" fill="#380918" />
    <!-- Inner Gold Bevel Ring -->
    <polygon points="50,7 120,7 163,50 163,120 120,163 50,163 7,120 7,50" fill="url(#goldMetallic3)" />
    <!-- Jewel Center Core -->
    <polygon points="52,10 118,10 160,52 160,118 118,160 52,160 10,118 10,52" fill="url(#jewelCenter3)" />

    <!-- Typography -->
    <text x="85" y="48" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldMetallic3)" text-anchor="middle" letter-spacing="1">11.11</text>
    <text x="85" y="80" font-family="'Times New Roman', Georgia, serif" font-size="26" font-weight="800" fill="url(#goldMetallic3)" text-anchor="middle" letter-spacing="1.5">PARFUM</text>
    <text x="85" y="112" font-family="'Times New Roman', Georgia, serif" font-size="25" font-style="italic" font-weight="700" fill="url(#goldMetallic3)" text-anchor="middle">Attar</text>
    <text x="85" y="142" font-family="'Times New Roman', Georgia, serif" font-size="26" font-weight="800" fill="url(#goldMetallic3)" text-anchor="middle" letter-spacing="1">Gala</text>
  </g>

  <!-- 3D Embossed Gold "LIVE NOW" Text Below Badge -->
  <g transform="translate(68, 238)">
    <text x="0" y="38" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="900" fill="#583B0E" letter-spacing="2">LIVE NOW</text>
    <text x="-2" y="36" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="900" fill="url(#goldTextGrad3)" letter-spacing="2" filter="url(#goldDropShadow3)">LIVE NOW</text>
    <text x="2" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#6B1832" letter-spacing="1.2">STARTING FROM 6TH NOVEMBER</text>
  </g>

  <!-- 4. Right Side Massive UPTO 60% OFF Typography -->
  <g transform="translate(760, 65)">
    <text x="50" y="46" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="900" fill="#5E0F2B" letter-spacing="2">UPTO</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="108" font-weight="950" fill="#5E0F2B" letter-spacing="-6">60</text>
    <text x="130" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="950" fill="#5E0F2B">%</text>
    <text x="130" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#5E0F2B">OFF</text>
    <text x="26" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#5E0F2B">Free Shipping</text>
    <text x="32" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#5E0F2B">Nationwide</text>
  </g>

  <!-- 5. Bottom Unified Ribbon -->
  <g transform="translate(20, 334)">
    <g transform="translate(10, 8)">
      <path d="M12 18 C11 18 10 17 9 17 C8 17 7 18 6 18 C4.5 18 3 15 3 12 C3 9 5 8 6.5 8 C7.5 8 8.2 8.6 9 8.6 C9.8 8.6 10.5 8 11.5 8 C12.5 8 13.5 8.5 14 9.5 C12.5 10.5 12.5 12.8 13.8 13.6 C13.2 15 12.5 17 11.5 18 Z M9.5 7.5 C10 6.5 10.8 5.5 10.5 4.5 C9.5 4.5 8.5 5.2 8 6.2 C7.6 7.2 8.5 7.6 9.5 7.5 Z" fill="#0F172A" transform="scale(0.85) translate(0, -2)" />
      <polygon points="18,5 28,11 18,17" fill="#0F172A" />
      <text x="34" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#0F172A">Download the App Now</text>
    </g>

    <rect x="168" y="0" width="790" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2D7C5" stroke-width="0.8" />

    <rect x="174" y="5" width="160" height="32" rx="4" fill="#6B1D3D" />
    <text x="184" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">Powered by:</text>
    <path d="M250 25 C248 18 253 14 255 13 C257 14 262 18 260 25 Z" fill="none" stroke="#FEE7A8" stroke-width="1.2" />
    <path d="M246 25 C243 20 248 16 252 17 C250 21 248 24 246 25 Z" fill="none" stroke="#FEE7A8" stroke-width="1.2" />
    <path d="M264 25 C267 20 262 16 258 17 C260 21 262 24 264 25 Z" fill="none" stroke="#FEE7A8" stroke-width="1.2" />
    <text x="270" y="25" font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="1">HASEENS</text>

    <text x="348" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#1E293B">Co-powered by:</text>

    <g transform="translate(426, 12)">
      <path d="M4 18 C0 10 8 4 12 18" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
      <path d="M10 18 C8 12 14 8 16 18" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
      <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="950" fill="#000000" letter-spacing="1.5">LAAJ</text>
    </g>

    <g transform="translate(528, 12)">
      <text x="0" y="15" font-family="'Times New Roman', Georgia, serif" font-size="13" font-weight="900" fill="#000000" letter-spacing="1.5">POLAWN</text>
    </g>

    <g transform="translate(636, 12)">
      <path d="M4 12 C4 4 12 4 14 12 C14 14 10 14 4 12 Z" fill="#C59B27" />
      <text x="18" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#000000" letter-spacing="0.5">ABAAN ZOHAN</text>
    </g>

    <g transform="translate(778, 12)">
      <text x="0" y="16" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="16" font-weight="700" fill="#000000">Truba</text>
    </g>

    <g transform="translate(860, 10)">
      <path d="M10 16 C6 14 4 10 8 6 C12 2 16 6 18 10 C16 14 12 16 10 16 Z" fill="#008080" />
      <circle cx="11" cy="7" r="1.5" fill="#FFFFFF" />
      <text x="2" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#008080">Fresh Birds</text>
    </g>
  </g>
</svg>

