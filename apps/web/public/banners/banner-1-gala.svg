<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 460" width="100%" height="100%">
  <defs>
    <!-- Background Midnight Blue Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="45%" stop-color="#0A1022" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="elfBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0035A8" />
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="textBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#003ACC" />
    </linearGradient>

    <!-- Soft Mask for Image blend -->
    <linearGradient id="imgMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="25%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>
    <mask id="modelBlendMask">
      <rect x="0" y="0" width="1320" height="460" fill="url(#imgMaskGrad)" />
    </mask>

    <!-- Radial Electric Glow -->
    <radialGradient id="electricRadial" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0052FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0" />
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Deep Midnight Base -->
  <rect width="1320" height="460" fill="url(#bgGrad1)" />

  <!-- 2. Electric Blue Atmospheric Glow -->
  <rect width="1320" height="460" fill="url(#electricRadial)" />

  <!-- 3. Embedded High-Res Model Photograph (Masked on Left) -->
  <g mask="url(#modelBlendMask)">
    <image 
      href="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&amp;fit=crop&amp;w=1200&amp;q=90" 
      x="520" 
      y="-40" 
      width="820" 
      height="540" 
      preserveAspectRatio="xMidYMid slice" 
    />
  </g>

  <!-- Vignette overlay over right image for cohesion -->
  <rect x="0" y="0" width="1320" height="460" fill="url(#bgGrad1)" opacity="0.35" />

  <!-- 4. Left Brand Header & Emblem (e.l.f. Blue & Midnight Aesthetic) -->
  <!-- Top Category Capsule -->
  <rect x="64" y="44" width="280" height="28" rx="14" fill="#0052FF" fill-opacity="0.16" stroke="#0052FF" stroke-opacity="0.5" stroke-width="1.2" />
  <circle cx="80" cy="58" r="4" fill="#0052FF" />
  <text x="94" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" letter-spacing="1.5">11.11 MEGA BEAUTÉ FESTIVAL</text>

  <!-- Main Punchy Headline -->
  <text x="64" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="950" fill="#FFFFFF" letter-spacing="-0.5">UNFILTERED BEAUTY.</text>
  <text x="64" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="950" fill="url(#textBlueGrad)" letter-spacing="-0.5">HIGH-IMPACT RESULTS.</text>

  <!-- Subtitle -->
  <text x="64" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
    Pakistan’s premier multi-vendor curated beauty collective.
  </text>
  <text x="64" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">
    Sourced directly from verified indie cosmetic houses with nationwide Cash on Delivery.
  </text>

  <!-- Big Discount Pill Callout -->
  <rect x="64" y="266" width="220" height="42" rx="21" fill="#0A142F" stroke="#0052FF" stroke-width="1.5" />
  <text x="82" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">UP TO 60% OFF</text>
  <rect x="238" y="277" width="34" height="20" rx="10" fill="#0052FF" />
  <text x="245" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">LIVE</text>

  <!-- Built-in e.l.f. Electric Blue Button -->
  <g transform="translate(64, 326)">
    <rect width="248" height="52" rx="26" fill="url(#btnGrad)" filter="url(#glowEffect)" opacity="0.3" />
    <rect width="248" height="52" rx="26" fill="url(#btnGrad)" />
    <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">SHOP THE GALA NOW</text>
    <path d="M198 26 L210 26 M205 20 L211 26 L205 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Guarantees near button -->
  <text x="336" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60A5FA">✓ Free Express Shipping</text>
  <text x="336" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">✓ 100% Cash on Delivery (COD)</text>

  <!-- 5. Bottom Built-in Verified Storehouses Ribbon -->
  <rect x="0" y="414" width="1320" height="46" fill="#04060C" fill-opacity="0.9" />
  <line x1="0" y1="414" x2="1320" y2="414" stroke="#0052FF" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="64" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#0052FF" letter-spacing="1.2">VERIFIED STORE HOUSES:</text>
  <text x="236" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1">
    MAISON DE ROSE  •  NOOR ARTISANAL  •  INDISENSE RITUALS  •  BOTANICA RAW LABS  •  AMBER &amp; OUD CO.
  </text>
  <text x="1150" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B">PAKISTAN (PKR)</text>
</svg>

