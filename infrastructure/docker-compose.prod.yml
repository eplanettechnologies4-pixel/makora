# ==============================================================================
# PRODUCTION DOCKER COMPOSE CONFIGURATION (CONTABO VPS READY)
# ==============================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: makaura-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makaura-backend-net

  redis:
    image: redis:7-alpine
    container_name: makaura-prod-redis
    restart: always
    command: >
      sh -c "
      if [ -n \"$${REDIS_PASSWORD}\" ]; then
        redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: UTC
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makaura-backend-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: makaura-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/uploads
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - makaura-backend-net
      - makaura-frontend-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: makaura-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
      NEXT_PUBLIC_CURRENCY_SYMBOL: ${NEXT_PUBLIC_CURRENCY_SYMBOL:-Rs.}
      NEXT_PUBLIC_CURRENCY_CODE: ${NEXT_PUBLIC_CURRENCY_CODE:-PKR}
    depends_on:
      - api
    networks:
      - makaura-frontend-net

  nginx:
    image: nginx:1.25-alpine
    container_name: makaura-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - makaura-frontend-net

volumes:
  postgres_prod_data:
    name: makaura_prod_postgres_data
  redis_prod_data:
    name: makaura_prod_redis_data
  api_uploads:
    name: makaura_prod_uploads
  certbot_conf:
    name: makaura_certbot_conf
  certbot_www:
    name: makaura_certbot_www

networks:
  makaura-backend-net:
    name: makaura_prod_backend_net
    internal: true
  makaura-frontend-net:
    name: makaura_prod_frontend_net
